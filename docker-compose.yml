# Webinterface hinter dem Reverse Proxy, zum Beispiel https://push.example.com
# Datenbank und WhatsApp-Session liegen im Volume "data".
services:
  monitor:
    image: ghcr.io/terhorstio/wa-business-notifier:latest
    init: true
    ports:
      - "3000:3000"
    environment:
      TRUST_PROXY: "1"
      COOKIE_SECURE: "1"
      PUBLIC_URL: "https://push.example.com"
    volumes:
      - data:/app/data
    shm_size: "1gb"
    restart: unless-stopped

volumes:
  data:
